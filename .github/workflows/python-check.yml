name: Cartoon Studio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import application modules
        run: |
          python - <<'PY'
          import sprite_renderer
          import explainer_renderer
          import realityblend_models
          import realityblend_engine
          import evidence_board_renderer
          import classic_cartoon_ui
          import realityblend_ui
          import evidence_board_ui
          import video_story_extractor
          import video_visual_analysis
          import video_url_adapter
          import video_evidence_ui
          import song_story_engine
          print("All Cartoon Studio Python modules imported successfully.")
          PY

      - name: Verify character assets
        run: |
          python - <<'PY'
          from pathlib import Path
          chars = [
              "ayo_finch", "biko_bean", "dex_orbit", "jax_noon",
              "kemi_bolt", "milo_quirk", "nala_vee", "professor_pogo",
              "rhea_moss", "simi_ray", "tari_reed", "zuri_spark"
          ]
          missing = [
              c for c in chars
              if not (Path("char_assets_fullbody") / c / "full_body.png").exists()
          ]
          if missing:
              raise SystemExit(f"Missing character assets: {missing}")
          print(f"Verified {len(chars)} full-body character assets.")
