name: Cartoon Studio web checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript preflight
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
